<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球农产品期货资讯</title>
<style>
  :root {
    --green: #1a7a4a;
    --green-dark: #115c36;
    --bg: #f5f7f6;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7a86;
    --border: #e3e8e5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.65;
  }
  header {
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    color: #fff; padding: 28px 20px 22px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  header .sub { font-size: 13px; opacity: 0.85; margin-top: 6px; }
  header .varieties { font-size: 12px; opacity: 0.7; margin-top: 4px; }

  .filters {
    max-width: 860px; margin: 16px auto 0; padding: 0 20px;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    border-radius: 20px; padding: 4px 14px; font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .chip.active { background: var(--green); border-color: var(--green); color: #fff; }

  main { max-width: 860px; margin: 0 auto; padding: 10px 20px 60px; }
  .day { margin-top: 26px; }
  .day-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .day-head .date { font-size: 18px; font-weight: 700; color: var(--green-dark); }
  .day-head .weekday { font-size: 13px; color: var(--muted); }
  .day-head .count { font-size: 12px; color: var(--muted); margin-left: auto; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge {
    font-size: 11px; padding: 2px 9px; border-radius: 4px; color: #fff; font-weight: 600;
  }
  .b-行情价格 { background: #c0392b; }
  .b-供需产量 { background: #2e7d32; }
  .b-政策贸易 { background: #1565c0; }
  .b-天气 { background: #00838f; }
  .b-国内市场 { background: #ad6800; }
  .b-机构观点 { background: #6a4fa3; }
  .tag { font-size: 11px; color: var(--green-dark); background: #e6f2ec; padding: 2px 8px; border-radius: 4px; }
  .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
  .card p { font-size: 14px; color: #3d4b57; }
  .card .src { margin-top: 8px; font-size: 12.5px; }
  .card .src a { color: var(--green); text-decoration: none; }
  .card .src a:hover { text-decoration: underline; }

  footer {
    max-width: 860px; margin: 0 auto; padding: 0 20px 40px;
    font-size: 12px; color: var(--muted); text-align: center;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

  .card.clickable { cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .card.clickable:hover { box-shadow: 0 3px 12px rgba(0,0,0,.08); transform: translateY(-1px); }
  .card .more { margin-top: 8px; font-size: 12.5px; color: var(--green); }

  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 100; padding: 24px 16px; overflow-y: auto;
  }
  #overlay.open { display: block; }
  .modal {
    max-width: 700px; margin: 4vh auto; background: #fff; border-radius: 12px;
    padding: 26px 28px 22px; position: relative;
  }
  .modal .close {
    position: absolute; top: 14px; right: 16px; border: none; background: none;
    font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1;
  }
  .modal h2 { font-size: 19px; margin: 8px 0 14px; line-height: 1.45; }
  .modal .body p { font-size: 14.5px; color: #2d3a45; margin-bottom: 12px; }
  .modal .foot {
    border-top: 1px solid var(--border); margin-top: 16px; padding-top: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .modal .foot a {
    background: var(--green); color: #fff; text-decoration: none;
    padding: 6px 16px; border-radius: 6px; font-size: 13px;
  }
  .modal .foot .note { font-size: 11.5px; color: var(--muted); }
  @media (max-width: 600px) { .modal { padding: 20px 16px 16px; margin: 2vh auto; } }
  @media (max-width: 600px) {
    header h1 { font-size: 20px; }
    .card { padding: 13px 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>🌾 全球农产品期货资讯</h1>
    <div class="sub">每个交易日早间更新 · 聚焦与国内期货市场联动的国际农产品动态</div>
    <div class="varieties">覆盖品种：大豆系（豆一/豆二/豆粕/豆油）· 棕榈油 · 菜油/菜粕 · 玉米/淀粉 · 白糖 · 棉花 · 花生 · 粳米</div>
  </div>
</header>

<div class="filters" id="filters"></div>

<main id="feed"></main>

<footer id="foot"></footer>

<div id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="data.js"></script>
<script>
(function () {
  var data = (window.NEWS_DATA || []).slice().sort(function (a, b) {
    return b.date.localeCompare(a.date);
  });
  var CATS = ["全部", "行情价格", "供需产量", "政策贸易", "天气", "国内市场", "机构观点"];
  var active = "全部";

  var filterBox = document.getElementById("filters");
  CATS.forEach(function (c) {
    var el = document.createElement("button");
    el.className = "chip" + (c === active ? " active" : "");
    el.textContent = c;
    el.onclick = function () {
      active = c;
      Array.prototype.forEach.call(filterBox.children, function (ch) {
        ch.classList.toggle("active", ch.textContent === c);
      });
      render();
    };
    filterBox.appendChild(el);
  });

  function weekday(ds) {
    var w = ["日", "一", "二", "三", "四", "五", "六"];
    return "星期" + w[new Date(ds + "T00:00:00").getDay()];
  }
  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }

  function render() {
    var feed = document.getElementById("feed");
    feed.innerHTML = "";
    var shown = 0;
    data.forEach(function (day) {
      var items = day.items.filter(function (it) {
        return active === "全部" || it.category === active;
      });
      if (!items.length) return;
      shown += items.length;
      var sec = document.createElement("section");
      sec.className = "day";
      sec.innerHTML =
        '<div class="day-head"><span class="date">' + esc(day.date) + '</span>' +
        '<span class="weekday">' + weekday(day.date) + '</span>' +
        '<span class="count">' + items.length + ' 条</span></div>';
      items.forEach(function (it) {
        var card = document.createElement("article");
        card.className = "card" + (it.detail ? " clickable" : "");
        var tags = (it.tags || []).map(function (t) {
          return '<span class="tag">' + esc(t) + "</span>";
        }).join("");
        card.innerHTML =
          '<div class="top"><span class="badge b-' + esc(it.category) + '">' + esc(it.category) + "</span>" + tags + "</div>" +
          "<h3>" + esc(it.title) + "</h3>" +
          "<p>" + esc(it.summary) + "</p>" +
          (it.url ? '<div class="src">来源：<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.source || it.url) + "</a></div>" : "") +
          (it.detail ? '<div class="more">点击查看详细内容 →</div>' : "");
        if (it.detail) {
          card.onclick = function (e) {
            if (e.target.tagName === "A") return;
            openModal(it, day.date);
          };
        }
        sec.appendChild(card);
      });
      feed.appendChild(sec);
    });
    if (!shown) feed.innerHTML = '<div class="empty">该分类下暂无资讯</div>';
  }

  var overlay = document.getElementById("overlay");
  var modal = document.getElementById("modal");
  function openModal(it, date) {
    var tags = (it.tags || []).map(function (t) {
      return '<span class="tag">' + esc(t) + "</span>";
    }).join("");
    var paras = String(it.detail).split(/\n\s*\n/).map(function (p) {
      return "<p>" + esc(p.trim()) + "</p>";
    }).join("");
    modal.innerHTML =
      '<button class="close" aria-label="关闭">&times;</button>' +
      '<div class="top"><span class="badge b-' + esc(it.category) + '">' + esc(it.category) + "</span>" + tags +
      '<span class="tag">' + esc(date) + "</span></div>" +
      "<h2>" + esc(it.title) + "</h2>" +
      '<div class="body">' + paras + "</div>" +
      '<div class="foot">' +
      (it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">阅读原文（' + esc(it.source || "链接") + '）</a>' : "") +
      '<span class="note">内容由 AI 基于公开报道整理转述，请以原文为准</span></div>';
    modal.querySelector(".close").onclick = closeModal;
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    overlay.classList.remove("open");
    document.body.style.overflow = "";
  }
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  render();
  var latest = data.length ? data[0].date : "—";
  document.getElementById("foot").innerHTML =
    "最近更新：" + esc(latest) + " · 资讯由 AI 自动搜集整理，摘要仅供参考，请以原文为准 · 不构成投资建议";
})();
</script>
</body>
</html>
